spring:
  application:
    name: immosenegal
  datasource:
    # Aucune valeur par défaut pour le mot de passe : il doit venir de l'environnement (.env).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/immosenegal}
    username: ${DB_USER:immosenegal}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Le schéma est géré uniquement par Flyway ; Hibernate se contente de le vérifier.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    # Liste d'origines séparées par des virgules (ex. l'URL du frontend déployé).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
