spring:
  application:
    name: immosenegal
  datasource:
    # Aucune valeur par défaut pour le mot de passe : il doit venir de l'environnement (.env).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/immosenegal}
    username: ${DB_USER:immosenegal}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Le schéma est géré uniquement par Flyway ; Hibernate se contente de le vérifier.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  # À mettre à « native » UNIQUEMENT derrière un proxy de confiance (ex. Render) pour lire la vraie IP du client.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Obligatoire, sans valeur par défaut. Générer avec : openssl rand -base64 48
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  security:
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-ip-max-failures: ${LOGIN_IP_MAX_FAILURES:20}
    login-window-minutes: ${LOGIN_WINDOW_MINUTES:15}
  bootstrap:
    # Création du PREMIER administrateur (voir README). À supprimer de l'environnement après usage.
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    # Liste d'origines séparées par des virgules (ex. l'URL du frontend déployé).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
