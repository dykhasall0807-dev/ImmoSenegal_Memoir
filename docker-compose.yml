# Base PostgreSQL pour le développement local.
# Les identifiants viennent du fichier .env (copie de .env.example) : rien n'est écrit en dur ici.
services:
  db:
    image: postgres:16
    container_name: immosenegal-db
    environment:
      POSTGRES_DB: ${DB_NAME:-immosenegal}
      POSTGRES_USER: ${DB_USER:-immosenegal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans le fichier .env}
    ports:
      - "5432:5432"
    volumes:
      - immosenegal-data:/var/lib/postgresql/data

volumes:
  immosenegal-data:
